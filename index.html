<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Priority Task Board</title>

    <link rel="stylesheet" href="./css/style.css" type="text/css">
</head>

<body>

    <div class="app">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="header-content">

                <div>
                    <span class="eyebrow">TASK MANAGEMENT</span>

                    <h1>Priority Task Board</h1>

                    <p>
                        Organize your work, track priorities,
                        and stay on top of deadlines.
                    </p>
                </div>

                <button
                    class="btn btn-primary"
                    id="openTaskModal"
                >
                    <span>+</span>
                    Create Task
                </button>

            </div>

        </header>


        <main class="container">

            <!-- ================= STATISTICS ================= -->

            <section class="stats-grid">

                <div class="stat-card">
                    <div class="stat-icon pending-icon">
                        ✓
                    </div>

                    <div>
                        <span class="stat-label">
                            Pending
                        </span>

                        <strong id="pendingCount">
                            0
                        </strong>
                    </div>
                </div>


                <div class="stat-card">
                    <div class="stat-icon today-icon">
                        📅
                    </div>

                    <div>
                        <span class="stat-label">
                            Due Today
                        </span>

                        <strong id="todayCount">
                            0
                        </strong>
                    </div>
                </div>


                <div class="stat-card overdue-card">
                    <div class="stat-icon overdue-icon">
                        !
                    </div>

                    <div>
                        <span class="stat-label">
                            Overdue
                        </span>

                        <strong id="overdueCount">
                            0
                        </strong>
                    </div>
                </div>

            </section>


            <!-- ================= TOOLBAR ================= -->

            <section class="toolbar">

                <div class="search-wrapper">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search tasks by title..."
                    >

                </div>


                <div class="filter-group">

                    <div class="filter-item">

                        <label for="statusFilter">
                            Status
                        </label>

                        <select id="statusFilter">

                            <option value="All">
                                All Status
                            </option>

                            <option value="To Do">
                                To Do
                            </option>

                            <option value="In Progress">
                                In Progress
                            </option>

                            <option value="Done">
                                Done
                            </option>

                        </select>

                    </div>


                    <div class="filter-item">

                        <label for="priorityFilter">
                            Priority
                        </label>

                        <select id="priorityFilter">

                            <option value="All">
                                All Priority
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Low">
                                Low
                            </option>

                        </select>

                    </div>

                </div>

            </section>


            <!-- ================= MESSAGES ================= -->

            <div
                id="successMessage"
                class="message success-message"
            ></div>

            <div
                id="errorMessage"
                class="message error-message"
            ></div>


            <!-- ================= TASK BOARD ================= -->

            <section class="board">

                <!-- TO DO -->

                <div class="board-column">

                    <div class="column-header">

                        <div class="column-title">

                            <span class="column-dot todo-dot"></span>

                            <h2>To Do</h2>

                            <span
                                class="task-count"
                                id="todoCount"
                            >
                                0
                            </span>

                        </div>

                    </div>


                    <div
                        class="task-list"
                        id="todoTasks"
                    ></div>

                </div>


                <!-- IN PROGRESS -->

                <div class="board-column">

                    <div class="column-header">

                        <div class="column-title">

                            <span class="column-dot progress-dot"></span>

                            <h2>In Progress</h2>

                            <span
                                class="task-count"
                                id="progressCount"
                            >
                                0
                            </span>

                        </div>

                    </div>


                    <div
                        class="task-list"
                        id="progressTasks"
                    ></div>

                </div>


                <!-- DONE -->

                <div class="board-column">

                    <div class="column-header">

                        <div class="column-title">

                            <span class="column-dot done-dot"></span>

                            <h2>Done</h2>

                            <span
                                class="task-count"
                                id="doneCount"
                            >
                                0
                            </span>

                        </div>

                    </div>


                    <div
                        class="task-list"
                        id="doneTasks"
                    ></div>

                </div>

            </section>

        </main>

    </div>


    <!-- ================= CREATE TASK MODAL ================= -->

    <div
        class="modal"
        id="taskModal"
    >

        <div class="modal-overlay" id="modalOverlay"></div>


        <div class="modal-content">

            <div class="modal-header">

                <div>

                    <span class="eyebrow">
                        NEW TASK
                    </span>

                    <h2>Create Task</h2>

                </div>

                <button
                    class="close-btn"
                    id="closeTaskModal"
                >
                    ×
                </button>

            </div>


            <form id="taskForm">

                <!-- TITLE -->

                <div class="form-group">

                    <label for="taskTitle">
                        Task Title
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Enter task title"
                    >

                    <small
                        class="field-error"
                        id="titleError"
                    ></small>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="taskDescription">
                        Description
                    </label>

                    <textarea
                        id="taskDescription"
                        rows="4"
                        placeholder="Enter task description"
                    ></textarea>

                </div>


                <!-- PRIORITY + DATE -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="taskPriority">
                            Priority
                            <span>*</span>
                        </label>

                        <select id="taskPriority">

                            <option value="">
                                Select priority
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="Low">
                                Low
                            </option>

                        </select>

                        <small
                            class="field-error"
                            id="priorityError"
                        ></small>

                    </div>


                    <div class="form-group">

                        <label for="taskDueDate">
                            Due Date
                            <span>*</span>
                        </label>

                        <input
                            type="date"
                            id="taskDueDate"
                        >

                        <small
                            class="field-error"
                            id="dateError"
                        ></small>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelTask"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create Task
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="./js/jsfile.js"></script>

</body>

</html>
